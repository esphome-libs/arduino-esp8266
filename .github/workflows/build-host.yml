# Run host test suite under valgrind for runtime checking of code.
# Also, a quick test that the mocking builds work at all

name: Build on host OS

on:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Tests
    # glibc 2.38+ (24.04) declares strlcpy/strlcat, and the 3.1.2 tooling predates it
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
    - run: |
        sudo apt update
        sudo apt install valgrind lcov
        bash ./tests/ci/host_test.sh

  mock-check:
    name: Mock
    # glibc 2.38+ (24.04) declares strlcpy/strlcat, and the 3.1.2 tooling predates it
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true
    - run: |
        cd tests/host
        make -j ../../libraries/ESP8266WebServer/examples/FSBrowser/FSBrowser
