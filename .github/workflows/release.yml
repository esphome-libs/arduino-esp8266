name: Package

on:
  pull_request:
  push:
    branches: [esphome]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of the core to package
        default: "3.1.2"
        required: true
      tag:
        description: Release tag, <core version>-esphome.<n>
        default: "3.1.2-esphome.1"
        required: true

permissions:
  contents: read

env:
  REF: ${{ inputs.ref || '3.1.2' }}
  TAG: ${{ inputs.tag || '3.1.2-esphome.0' }}

jobs:
  package:
    name: Package ${{ inputs.ref || '3.1.2' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          submodules: recursive
          path: core
      - name: Core version
        id: version
        run: |
          case "$TAG" in
            *-esphome.*) ;;
            *) echo "tag must be <core version>-esphome.<n>, got $TAG"; exit 1 ;;
          esac
          echo "version=${TAG%-esphome.*}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C core rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git -C core log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Package
        run: ./package.sh core "${{ steps.version.outputs.version }}" "$TAG"
      - name: Verify layout
        run: ci/verify.sh arduino-esp8266-*.tar.gz "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            arduino-esp8266-*.tar.gz
            arduino-esp8266-*.tar.gz.sha256

  compare:
    name: Compare with the registry package
    needs: package
    # Only upstream releases have a registry package to compare with
    if: needs.package.outputs.version == '3.1.2' || needs.package.outputs.version == '3.1.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Fetch the registry package
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          case "$VERSION" in
            3.1.2) pkg=3.30102.0; sha=40d782c013987ec2660a7172eeeb66d19ea486d1eeef00847ea3747365de94b7 ;;
            3.1.1) pkg=3.30101.0; sha=437c1cb947c57fabaf92d4862754e6c9431d6f1fd1cf6adb5e746e78541d037b ;;
          esac
          curl -fsSL --retry 5 -o registry.tar.gz \
            "https://dl.registry.platformio.org/download/platformio/tool/framework-arduinoespressif8266/$pkg/framework-arduinoespressif8266-$pkg.tar.gz"
          echo "$sha  registry.tar.gz" | sha256sum -c
      - name: Compare
        run: python3 ci/compare.py registry.tar.gz arduino-esp8266-*.tar.gz

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch'
    needs: [package, compare]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Checksums
        run: |
          cat arduino-esp8266-*.tar.gz.sha256 > sha256sums.txt
          rm arduino-esp8266-*.tar.gz.sha256
          sha256sum -c sha256sums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.package.outputs.sha }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          # The tag marks the packaged commit; created here so the release
          # needs no target, which the token cannot set in a fork
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi
          # The release may have been created by hand before the build finished
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              arduino-esp8266-*.tar.gz sha256sums.txt
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes "ESP8266 Arduino core $VERSION from commit $SHA, packaged for ESPHome's native toolchain. Checksums are in sha256sums.txt." \
              arduino-esp8266-*.tar.gz sha256sums.txt
          fi
